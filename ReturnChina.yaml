# 12.01am Sun 31 Aug 2026
dns:
  enable: true
  ipv6: false
  listen: 127.0.0.1:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query

proxies:
  - name: "🇺🇸 us-relay"
    type: ss
    server: 1.2.3.4
    port: 8388
    cipher: aes-256-gcm
    password: "abc123"
    udp: true

  - name: "🇺🇸 us-azure"
    type: ss
    server: 1.2.3.4
    port: 2059
    cipher: aes-256-gcm
    password: "abc124"
    udp: true

proxy-groups:
  - name: 🎯 PROXIES
    type: select
    proxies:
      - "🇺🇸 us-relay"
      - "🇺🇸 us-azure"

  - name: 🐟 Default Policy
    type: select
    proxies:
      - "DIRECT"
      - "🇺🇸 us-relay"
      - "🇺🇸 us-azure"

rule-providers:
  reject:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt"
    path: ./ruleset/reject.yaml
    interval: 86400

  School_M365:
    type: http
    behavior: classical
    url: "https://raw.githubusercontent.com/Jovanykoch/JovanyKoch.github.io/main/Clash/rule/School_M365.txt"
    path: ./ruleset/School_M365.txt
    interval: 86400

  private:
    type: http
    behavior: domain
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/private.txt"
    path: ./ruleset/private.yaml
    interval: 86400

rules:
  - RULE-SET,private,DIRECT
  - GEOIP,LAN,DIRECT,no-resolve
  - RULE-SET,reject,REJECT
  - DOMAIN-SUFFIX,github.com,🎯 PROXIES
  - DOMAIN-KEYWORD,github,🎯 PROXIES
  - DOMAIN-SUFFIX,openai.com,🎯 PROXIES
  - DOMAIN-SUFFIX,geminiai.com,🎯 PROXIES
  - DOMAIN-SUFFIX,chatgpt.com,🎯 PROXIES
  - DOMAIN-SUFFIX,anthropic.com,🎯 PROXIES
  - DOMAIN-SUFFIX,claude.ai,🎯 PROXIES
  - RULE-SET,School_M365,🎯 PROXIES
  - MATCH,🐟 Default Policy
